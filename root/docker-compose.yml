version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reef_postgres
    environment:
      POSTGRES_USER: reef_admin
      POSTGRES_PASSWORD: reef_secure_pass_90s
      POSTGRES_DB: reef_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reef_admin -d reef_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: reef_fastapi_server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../server:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://reef_admin:reef_secure_pass_90s@db:5432/reef_db
      - SECRET_KEY=KABOOM_SUPER_SECRET_POP_ART_KEY_2026
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: reef_react_client
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
